name: bridge

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Test two-to-four-client duel agreement
        run: dotnet run --project ../mod/tests/DuelNegotiatorTests.csproj
      - name: Validate Bazzite installer syntax
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n ../install/install-bazzite.sh
          bash -n ../install/install-arena-bazzite.sh
          python3 ../install/test_arena_bazzite.py
          g++ -std=c++17 -Wall -Werror ../melee-unlocked-patch/input_contract_tests.cpp -o /tmp/spire-input-contract-tests
          /tmp/spire-input-contract-tests
      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          [void][scriptblock]::Create((Get-Content ../install/install-windows.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content ../install/install-arena-windows.ps1 -Raw))
      - name: Assemble platform mod bundle
        shell: bash
        run: |
          mkdir -p ../package/SpireShowdown
          cp ../dist/mod/SpireShowdown/SpireShowdown.dll ../package/SpireShowdown/
          cp ../dist/mod/SpireShowdown/SpireShowdown.json ../package/SpireShowdown/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/spire-showdown-bridge.exe ../package/SpireShowdown/
            cp ../install/install-arena-windows.ps1 ../package/install-windows.ps1
            cp ../install/install-arena-windows.ps1 ../package/
          else
            cp target/release/spire-showdown-bridge ../package/SpireShowdown/
            chmod +x ../package/SpireShowdown/spire-showdown-bridge
            cp ../install/install-arena-bazzite.sh ../package/install-bazzite.sh
            cp ../install/install-arena-bazzite.sh ../package/
            chmod +x ../package/install-bazzite.sh
            chmod +x ../package/install-arena-bazzite.sh
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: spire-showdown-mod-${{ runner.os }}-x86_64
          path: package
          if-no-files-found: error
          retention-days: 30
