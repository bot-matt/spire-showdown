name: release-alpha7

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-alpha5.yml]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      BRIDGE_RUN: 36960131909
      SLIPPI_RUN: 36951017649
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for release builds
        shell: bash
        run: |
          for run in "$BRIDGE_RUN" "$SLIPPI_RUN"; do
            while true; do
              status=$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json status --jq .status)
              if [ "$status" = completed ]; then
                conclusion=$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)
                [ "$conclusion" = success ] || exit 1
                break
              fi
              sleep 15
            done
          done

      - name: Download verified artifacts
        shell: bash
        run: |
          mkdir -p stage/mod-linux stage/mod-windows stage/slippi-linux stage/slippi-windows release
          gh run download "$BRIDGE_RUN" --repo "$GITHUB_REPOSITORY" --name spire-showdown-mod-Linux-x86_64 --dir stage/mod-linux
          gh run download "$BRIDGE_RUN" --repo "$GITHUB_REPOSITORY" --name spire-showdown-mod-Windows-x86_64 --dir stage/mod-windows
          gh run download "$SLIPPI_RUN" --repo "$GITHUB_REPOSITORY" --name spire-showdown-slippi-bazzite-x86_64 --dir stage/slippi-linux
          gh run download "$SLIPPI_RUN" --repo "$GITHUB_REPOSITORY" --name spire-showdown-slippi-windows-x86_64 --dir stage/slippi-windows

      - name: Assemble release assets
        shell: bash
        run: |
          (cd stage/mod-linux && zip -qr ../../release/spire-showdown-mod-Linux-x86_64.zip .)
          (cd stage/mod-windows && zip -qr ../../release/spire-showdown-mod-Windows-x86_64.zip .)
          (cd stage/slippi-linux && zip -qr ../../release/spire-showdown-slippi-bazzite-x86_64.zip .)
          cp stage/slippi-windows/Spire-Showdown-Slippi-Windows-x86_64.zip \
            release/spire-showdown-slippi-windows-x86_64.zip
          (cd release && sha256sum *.zip > SHA256SUMS.txt)

      - name: Publish Alpha 7
        shell: bash
        run: |
          gh release create v0.2.0-alpha.7 release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Spire Showdown v0.2.0-alpha.7' \
            --notes 'Fixes Steam Controller detection when Steam Input bypasses Godot. Auto mode now falls back to the game process joystick devices, rejects virtual mouse/tablet devices, prefers Steam/Xbox/gamepads, and uses XInput directly on Windows.'
