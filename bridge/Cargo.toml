[package]
name = "spire-showdown-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local companion for Spire Showdown"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
x11rb = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.13"
