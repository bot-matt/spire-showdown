[package]
name = "spire-showdown-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local companion for Spire Showdown"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.13"

